/* ============ 音频内联 S4 ============ */
function toggleAudio(card){
  const btn=card.querySelector('[data-act="audio-toggle"]');
  const au=card.querySelector('audio[data-el="audio"]');
  const bars=card.querySelectorAll('.waveform .bar');
  const cur=card.querySelector('[data-el="cur"]');
  const durEl=card.querySelectorAll('.ap-time')[1];
  const total=bars.length||1;
  const fmt=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  if(!au){toast('音频不可用');return}
  if(!au._bound){
    au._bound=true;
    au.addEventListener('timeupdate',()=>{const p=au.duration?au.currentTime/au.duration:0;const f=Math.round(p*total);bars.forEach((b,bi)=>b.classList.toggle('played',bi<f));cur.textContent=fmt(au.currentTime)});
    au.addEventListener('loadedmetadata',()=>{if(durEl&&au.duration)durEl.textContent=fmt(au.duration)});
    au.addEventListener('ended',()=>{audioState.playing=false;audioState.card=null;btn.innerHTML=I.play;bars.forEach(b=>b.classList.remove('played'));cur.textContent='0:00'});
    au.addEventListener('error',()=>{audioState.playing=false;btn.innerHTML=I.play;if(durEl)durEl.textContent='--:--'});
    // 波形可点击/拖拽 seek（阻止冒泡到 stage，避免触发翻页滑动）
    const wave=card.querySelector('[data-el="wave"]');
    if(wave&&!wave._seek){
      wave._seek=true;wave.style.cursor='pointer';
      const frac=e=>{const r=wave.getBoundingClientRect();const cx=e.touches?e.touches[0].clientX:e.clientX;return Math.max(0,Math.min(1,(cx-r.left)/r.width))};
      const seek=e=>{if(!au.duration)return;const t=frac(e)*au.duration;au.currentTime=t;const f=Math.round((t/au.duration)*total);bars.forEach((b,bi)=>b.classList.toggle('played',bi<f));cur.textContent=fmt(t)};
      wave.addEventListener('click',seek);
      let drag=false;
      wave.addEventListener('mousedown',e=>{drag=true;seek(e);e.preventDefault();e.stopPropagation()});
      document.addEventListener('mousemove',e=>{if(drag)seek(e)});
      document.addEventListener('mouseup',()=>{drag=false});
      wave.addEventListener('touchstart',e=>{seek(e);e.stopPropagation()},{passive:true});
      wave.addEventListener('touchmove',e=>{seek(e);e.preventDefault();e.stopPropagation()},{passive:false});
    }
  }
  if(audioState.playing&&audioState.card===card){au.pause();audioState.playing=false;btn.innerHTML=I.play}
  else{
    if(audioState.audio&&audioState.audio!==au)audioState.audio.pause();
    audioState.playing=true;audioState.card=card;audioState.audio=au;btn.innerHTML=I.pause;
    if(au.play)au.play().catch(()=>{audioState.playing=false;btn.innerHTML=I.play;toast('音频加载失败')});
  }
}

/* ============ 真实下载 ============ */
function extOf(it){const m=(it.url||'').match(/\.([a-z0-9]+)(?:$|\?|#)/i);return m?'.'+m[1].toLowerCase():''}
function downloadURL(url,filename){const a=document.createElement('a');a.href=url;a.download=filename||'';document.body.appendChild(a);a.click();a.remove()}
function downloadBlob(blob,filename){const u=URL.createObjectURL(blob);downloadURL(u,filename);setTimeout(()=>URL.revokeObjectURL(u),4000)}
function dlOne(it){
  if(!it.url){toast('该文件为演示占位，暂无源文件');return}
  downloadURL(it.url,(it.title||'file')+extOf(it));toast('下载：'+it.title)
}
async function dlZip(list,name){
  if(!window.JSZip){toast('打包组件未加载');return}
  const zip=new JSZip();let n=0;toast('打包中…');
  for(const it of list){
    if(!it.url)continue;
    try{const r=await fetch(it.url);if(!r.ok)continue;zip.file((it.title||it.id)+extOf(it),await r.blob());n++}catch(e){}
  }
  if(!n){toast('没有可下载的源文件');return}
  const blob=await zip.generateAsync({type:'blob'});
  downloadBlob(blob,name||'download.zip');toast('已打包 '+n+' 个文件')
}
function openMenu(it,x,y){
  const groupItems=items.filter(i=>i.group===it.group);
  el.menu.innerHTML=`
    <div class="menu-item" data-act="dl-one">${I.download}<span>下载当前文件</span><span class="sz">${fmtSize(it.size)}</span></div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-act="dl-zip">${I.zip}<span>下载该组 ZIP</span><span class="sz">${groupItems.length} 份</span></div>`;
  el.menu.style.left=Math.min(x,innerWidth-220)+'px';
  el.menu.style.top=Math.min(y,innerHeight-160)+'px';
  el.menu.classList.add('open');
  el.menu._item=it;
}

},{passive:false});

/* ============ 滑动 / 拖拽翻页 ============ */
let sx=0,sy=0,dragging=false,dragDx=0,activeCard=null,swipeGuard=false;
function pStart(x,y){sx=x;sy=y;dragging=false;dragDx=0;activeCard=el.stack.querySelector('.card.active')}
function pMove(x,y){
  const dx=x-sx,dy=y-sy;
  if(!dragging&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){dragging=true;el.stage.classList.add('drag');if(activeCard)activeCard.style.transition='none'}
  if(dragging){
    dragDx=dx;
    const atEdge=(current<=0&&dx>0)||(current>=items.length-1&&dx<0); // 首/末张朝外滑：加阻力营造回弹感
    const r=atEdge?0.28:0.5;
    if(activeCard)activeCard.style.transform=`translateX(${dx*r}px) scale(${1-Math.min(Math.abs(dx)/1400,0.05)})`;
  }
}
function pEnd(){
  el.stage.classList.remove('drag');
  const dir=dragDx<0?1:-1;
  const canNav=dragging&&Math.abs(dragDx)>60&&(dir<0?current>0:current<items.length-1);
  if(canNav){
    if(activeCard)activeCard.style.transition=''; // 旧卡在被拖到的位置淡出（不清 transform，避免回弹再滑出）
    swipeGuard=true;setTimeout(()=>swipeGuard=false,400); // 仅真正翻页后屏蔽随后的 click
    go(dir);
  }else if(activeCard){
    activeCard.style.transition='';activeCard.style.transform=''; // 边界或未达阈值：平滑回弹
  }
  dragging=false;activeCard=null;dragDx=0;
}
el.stage.addEventListener('touchstart',e=>{const t=e.touches[0];pStart(t.clientX,t.clientY)},{passive:true});
el.stage.addEventListener('touchmove',e=>{const t=e.touches[0];pMove(t.clientX,t.clientY)},{passive:true});
el.stage.addEventListener('touchend',pEnd);
el.stage.addEventListener('mousedown',e=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;pStart(e.clientX,e.clientY);const mv=ev=>pMove(ev.clientX,ev.clientY);const up=ev=>{pEnd();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});

/* ============ 初始化 ============ */
/* 数据：先联网远程 manifest，失败回退本地 manifest.json，再失败回退 DEMO */
let refreshing=false;
async function fetchManifest(){
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(MANIFEST_URL,{cache:'no-store',signal:c.signal});clearTimeout(t);
    if(r.ok){const d=await r.json();if(d&&d.items)return d}}catch(e){}
  try{const r=await fetch(MANIFEST_LOCAL,{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.items)return d}}catch(e){}
  return null
}
function loadItems(d){
  if(!d||!d.items)return false;
  manifest=d;
  /* 按 uploaded 时间戳升序排列（老→新），无 uploaded 的排最前 */
  items=d.items.slice().sort(function(a,b){
    var ta=a.uploaded?new Date(a.uploaded).getTime():0;
    var tb=b.uploaded?new Date(b.uploaded).getTime():0;
    return ta-tb;
  });
  versionSeen=d.version;buildDock();return true
}
async function refresh(){
  if(refreshing)return;refreshing=true;toast('刷新中…');
  const d=await fetchManifest();
  refreshing=false;
  if(!d){toast('联网失败，保持当前数据');return}
  if(versionSeen!=null&&d.version===versionSeen){toast('已是最新');return}
  loadItems(d);current=items.length-1;showCard(current,1,false);savePos();
  toast('已更新 · 定位到最新');
}
async function init(){
  console.log('[openclaw 文件列车] app ready · build sw-14');
  setTheme((()=>{try{return localStorage.getItem('sw-theme')||'light'}catch(e){return'light'}})());
  const d=await fetchManifest();
  if(d)loadItems(d);
  else{items=DEMO.items.slice();versionSeen=DEMO.version;buildDock();toast('联网失败，使用演示数据')}
  let start=items.length-1; // 默认最新
  try{const p=parseInt(localStorage.getItem('sw-pos'));if(!isNaN(p)&&p>=0&&p<items.length)start=p}catch(e){}
  current=start;
  showCard(start,1,false);
}
init();
