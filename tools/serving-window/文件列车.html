<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>文件列车 · Serving Window</title>
<style>
/* ============ Zenthos 令牌（仅注册色板；暗模式用 color-mix/oklch 派生） ============ */
:root{
  --bg:#ffffff; --surface:#f5f5f5; --fg:#181818; --muted:#6d6d6d;
  --border:#cbcbcb; --accent:#000000; --accent2:#2962ff;
  --radius:16px; --radius-lg:clamp(20px,3.2vw,30px); --radius-pill:9999px;
  --ease:cubic-bezier(.2,0,0,1);
  --font:'Roobert',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --glass:linear-gradient(180deg,rgba(0,0,0,.045),rgba(0,0,0,0) 38%,rgba(0,0,0,0) 64%,rgba(0,0,0,.03));
  --shadow-window:0 1px 0 rgba(255,255,255,.6) inset, 0 30px 80px -40px rgba(0,0,0,.45), 0 4px 18px -10px rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --bg:#181818; --surface:#000000; --fg:#ffffff; --muted:#6d6d6d;
  --border:color-mix(in oklch,#ffffff 14%,#181818);
  --accent:#ffffff; --accent2:#2962ff;
  --glass:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(0,0,0,.22));
  --shadow-window:0 0 0 1px color-mix(in oklch,#2962ff 22%,#181818) inset, 0 0 90px -30px color-mix(in oklch,#2962ff 30%,#181818), 0 30px 80px -40px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;
  display:grid;place-items:center;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 焦点可见性（键盘可达 · a11y） */
:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
/* 空状态 */
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.empty-state[hidden]{display:none} /* hidden 必须生效，否则 display:flex 会覆盖 [hidden]（author origin > UA origin），透明满铺层常驻吞掉卡片点击/右键 */

/* ============ 背板 ============ */
.backdrop{position:fixed;inset:0;background:var(--bg);z-index:0}
[data-theme="dark"] .backdrop{background:radial-gradient(120% 80% at 50% 0%,color-mix(in oklch,#2962ff 8%,#181818),#181818 60%)}

/* ============ 车窗 ============ */
.window{
  position:relative;z-index:1;
  width:100vw;height:100vh;height:100dvh;
  margin:0 auto;
  background:var(--bg);
  border-radius:0;border:0 solid var(--border);
  box-shadow:none;overflow:hidden;
  display:flex;flex-direction:column;
}
/* 桌面：浮在背板上的全景车窗 */
@media (min-width:820px){
  body{background:var(--surface)}
  .window{
    width:min(1240px,92vw);height:min(760px,90vh);height:min(760px,90dvh);
    border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-window);overflow:hidden;
  }
}
/* 玻璃高光层 */
.glass{position:absolute;inset:0;pointer-events:none;background:var(--glass);opacity:.9;z-index:5}
.glass.sweep::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
  transform:translateX(-60%);animation:sweep .5s var(--ease);
}
@keyframes sweep{to{transform:translateX(60%)}}

/* ============ 标题栏（持久总标题） ============ */
.titlebar{
  position:relative;z-index:6;display:flex;align-items:center;gap:12px;
  min-height:64px;
  padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-left));
}
.titlebar .title{
  flex:1;font-size:15px;font-weight:500;letter-spacing:.01em;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  padding-left:64px;padding-right:64px; /* 给两侧工具留对称空间，保持视觉居中 */
}
.tools{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:6px}
.tools.left{left:max(14px,env(safe-area-inset-left));right:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--radius-pill);
  display:grid;place-items:center;border:1px solid var(--border);
  background:color-mix(in oklch,var(--bg) 82%,transparent);color:var(--muted);
  cursor:pointer;transition:color .15s var(--ease),border-color .15s,transform .2s var(--ease);
}
.icon-btn:hover{color:var(--fg);border-color:var(--fg)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:18px;height:18px;display:block}

/* ============ 舞台 / 卡片 ============ */
.stage{
  position:relative;z-index:3;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:0 clamp(14px,4vw,40px);
  touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;
}
.stage.drag{cursor:grabbing}
.cardstack{position:relative;width:100%;height:100%;max-width:680px}
.card{
  position:absolute;inset:0;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  opacity:0;will-change:transform,opacity;
  transition:transform .36s var(--ease),opacity .36s var(--ease);
}
.card.active{opacity:1;transform:translateX(0) scale(1)}
.card.enter-next{transform:translateX(22%) scale(.96);opacity:0}
.card.leave-next{transform:translateX(-22%) scale(.96);opacity:0}
.card.enter-prev{transform:translateX(-22%) scale(.96);opacity:0}
.card.leave-prev{transform:translateX(22%) scale(.96);opacity:0}

/* 卡片内部 */
.card-face{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.card-fade{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--bg) 86%)}
.card-taphint{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);background:color-mix(in oklch,var(--bg) 70%,transparent);
  padding:6px 11px;border:1px solid var(--border);border-radius:var(--radius-pill)}
.card-taphint svg{width:13px;height:13px}
/* 类型徽标条 */
.card-meta{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
.type-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px 10px;letter-spacing:.04em}
.type-chip svg{width:12px;height:12px}
.badge-temp{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);
  border:1px solid var(--border);border-radius:var(--radius-pill);padding:4px 10px}
.badge-temp svg{width:12px;height:12px}
.badge-ver{width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.card-title{padding:2px 16px 10px;font-size:18px;font-weight:600;letter-spacing:.005em;line-height:1.3}

/* —— markdown 预览 —— */
.md-excerpt{padding:0 16px 14px;overflow:hidden;flex:1}
.md-excerpt h3{margin:.1em 0 .35em;font-size:16px;font-weight:600}
.md-excerpt p{margin:0 0 .5em;font-size:13px;line-height:1.65;color:var(--fg)}
.md-excerpt .formula{font-family:Georgia,serif;font-style:italic;font-size:14px;
  color:var(--fg);border-left:2px solid var(--accent);padding:4px 0 4px 10px;margin:.4em 0}
/* —— pdf 预览 —— */
.pdf-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 16px}
.pdf-page{width:min(220px,62%);aspect-ratio:1/1.414;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:14px;position:relative;
  box-shadow:0 18px 40px -24px rgba(0,0,0,.5)}
.pdf-page .ln{height:5px;background:var(--border);border-radius:2px;margin:0 0 7px}
.pdf-page .ln.h{height:9px;background:var(--fg);width:50%;margin-bottom:12px}
.pdf-page .ln.s{width:80%}.pdf-page .ln.l{width:92%}
.pdf-pages{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
/* —— image 预览 —— */
.img-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 16px 16px}
.img-art{width:100%;height:100%;border-radius:10px;display:block}
/* —— video 预览 —— */
.vid-wrap{flex:1;position:relative;margin:6px 16px 16px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.vid-poster{width:100%;height:100%;display:block}
.vid-play{position:absolute;inset:0;display:grid;place-items:center}
.vid-play .ring{width:58px;height:58px;border-radius:var(--radius-pill);
  background:color-mix(in oklch,var(--bg) 70%,transparent);border:1px solid var(--border);
  display:grid;place-items:center;backdrop-filter:blur(2px)}
.vid-play .ring svg{width:22px;height:22px;margin-left:3px;fill:var(--fg)}
.vid-dur{position:absolute;right:10px;bottom:10px;font-size:11px;font-family:var(--mono);
  color:#ffffff;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:6px}
/* —— audio 内联播放器 —— */
.audio-player{padding:6px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;justify-content:center}
.ap-art{width:88px;height:88px;border-radius:18px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.ap-art svg{width:36px;height:36px;color:var(--accent)}
.ap-sub{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}
.waveform{width:100%;height:34px;display:flex;align-items:center;gap:2px}
.waveform .bar{flex:1;background:var(--border);border-radius:2px;min-width:2px;transition:background .2s}
.waveform .bar.played{background:var(--accent)}
.ap-controls{display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.ap-time{font-size:12px;color:var(--muted);font-family:var(--mono);min-width:34px;text-align:center}
.ap-play{width:48px;height:48px;border-radius:var(--radius-pill);
  background:var(--accent);color:var(--bg);border:none;display:grid;place-items:center;cursor:pointer;
  transition:transform .15s var(--ease)}
.ap-play:active{transform:scale(.92)}
.ap-play:hover{transform:scale(1.05)}
.ap-play svg{width:20px;height:20px}
[data-theme="dark"] .ap-play{color:#181818}
/* —— 通用文件卡（按格式 SVG；未知类型走兜底） —— */
.file-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:14px 16px 22px}
.file-art{width:min(252px,76%);height:auto;display:block}
.file-ext{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--fg);
  border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 14px;background:var(--surface)}
.rc-file{width:100%;height:100%;display:grid;place-items:center;padding:10px}
.rc-file .file-art{width:84px}
/* —— knowledge-map 预览 —— */
.map-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 16px}
.map-art{width:100%;height:100%;border-radius:10px}
/* —— 知识地图：内联 D3 视图（全屏预览内）· 以最新 Viewer 模板为基准忠实移植 —— */
/* kmv 局部令牌：全部由文件列车全局令牌派生，自动跟随 light/dark 主题 */
.kmv-host{display:flex;overflow:hidden;
  --km-panel:var(--bg);
  --km-panel-2:var(--surface);
  --km-panel-3:color-mix(in oklch,var(--fg) 6%,var(--bg));
  --km-fg:var(--fg);
  --km-fg-2:color-mix(in oklch,var(--fg) 80%,var(--bg));
  --km-muted:var(--muted);
  --km-muted-2:color-mix(in oklch,var(--muted) 55%,var(--bg));
  --km-border:var(--border);
  --km-border-soft:color-mix(in oklch,var(--fg) 8%,var(--bg));
  --km-accent:var(--accent2);
  --km-accent-soft:color-mix(in oklch,var(--accent2) 12%,transparent);
  --km-grid:color-mix(in oklch,var(--fg) 5%,transparent);
  --km-grid-strong:color-mix(in oklch,var(--fg) 12%,transparent);
  --km-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.08);
  --km-shadow-lg:0 18px 50px rgba(0,0,0,.18);
}
.kmv-root{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--km-panel)}

/* ---------- 顶部栏 ---------- */
.kmv-bar{display:flex;align-items:center;gap:10px;padding:0 12px;height:56px;border-bottom:1px solid var(--km-border);flex-wrap:nowrap;flex-shrink:0;position:relative;background:var(--km-panel)}
.kmv-iconbtn{width:34px;height:34px;border:1px solid var(--km-border);background:var(--km-panel);color:var(--km-fg-2);border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;transition:border-color .15s,color .15s}
.kmv-iconbtn:hover{border-color:var(--km-fg);color:var(--km-fg)}
.kmv-iconbtn svg{width:17px;height:17px}
.kmv-brand{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;pointer-events:none;min-width:0}
.kmv-bt{display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.25}
.kmv-title{font-size:15px;font-weight:650;color:var(--km-fg);max-width:calc(100vw - 220px);overflow:hidden;text-align:center;white-space:nowrap}
.kmv-title .kmv-mtxt{display:inline-block;will-change:transform}
.kmv-metabar{font-size:11px;color:var(--km-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kmv-metabar .kmv-ver{font-family:var(--mono)}
.kmv-spacer{flex:1}
.kmv-stats{display:flex;gap:14px;color:var(--km-muted);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.kmv-stats b{color:var(--km-fg);font-weight:650}
.kmv-more{display:none}
.kmv-actions{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.kmv-btn{border:1px solid var(--km-border);background:var(--km-panel);color:var(--km-fg-2);border-radius:8px;padding:0 12px;height:34px;font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;transition:border-color .15s,color .15s}
.kmv-btn:hover{border-color:var(--km-fg);color:var(--km-fg)}
.kmv-btn.on{background:var(--km-fg);color:var(--km-panel);border-color:var(--km-fg)}
.kmv-btn svg{width:16px;height:16px;flex:0 0 auto}
.kmv-seg{display:inline-flex;border:1px solid var(--km-border);border-radius:9999px;padding:3px;background:var(--km-panel-2);flex:0 0 auto}
.kmv-tab{border:none;background:none;font:inherit;font-size:12.5px;font-weight:550;padding:0 13px;height:28px;border-radius:9999px;cursor:pointer;color:var(--km-muted);white-space:nowrap}
.kmv-tab.on{background:var(--km-panel);color:var(--km-fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ---------- 主体 ---------- */
.kmv-stage{flex:1;display:flex;min-height:0;min-width:0;position:relative}
.kmv-side{width:264px;flex:0 0 auto;border-right:1px solid var(--km-border);background:var(--km-panel);display:flex;flex-direction:column;min-height:0;transition:margin-left .22s var(--ease)}
.kmv-root.kmv-side-collapsed .kmv-side{margin-left:-264px}
.kmv-side-head{padding:14px 16px 10px;border-bottom:1px solid var(--km-border-soft)}
.kmv-side-head .kmv-row{display:flex;align-items:center;justify-content:space-between}
.kmv-side-head h3{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--km-muted);font-weight:600}
.kmv-sidecnt{font-size:11px;color:var(--km-muted-2);font-variant-numeric:tabular-nums}
.kmv-side-desc{font-size:11.5px;color:var(--km-muted);margin-top:7px;line-height:1.45}
.kmv-filter-hint{font-size:11px;color:var(--km-accent);margin-top:8px;display:none}
.kmv-filter-hint.on{display:block}
.kmv-filter-hint .kmv-filter-reset{color:var(--km-accent);cursor:pointer;text-decoration:underline}
.kmv-tree{flex:1;overflow:auto;padding:6px 8px 14px}
.kmv-grp{margin:2px 0 6px}
.kmv-grp > .kmv-gh{display:flex;align-items:center;gap:8px;padding:7px 8px;cursor:pointer;border-radius:8px;user-select:none}
.kmv-grp > .kmv-gh:hover{background:var(--km-panel-2)}
.kmv-grp .kmv-gdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--km-panel)}
.kmv-grp .kmv-gname{font-size:12.5px;font-weight:600;color:var(--km-fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmv-grp .kmv-gcnt{font-size:11px;color:var(--km-muted-2);font-variant-numeric:tabular-nums}
.kmv-grp .kmv-chev{width:13px;height:13px;color:var(--km-muted);transition:transform .18s;flex:0 0 auto}
.kmv-grp.closed .kmv-chev{transform:rotate(-90deg)}
.kmv-grp.closed .kmv-gbody{display:none}
.kmv-gbody{padding:1px 0 2px 12px}
.kmv-nitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;position:relative}
.kmv-nitem:hover{background:var(--km-panel-2)}
.kmv-nitem.sel{background:var(--km-accent-soft)}
.kmv-nitem.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--km-accent)}
.kmv-nitem .kmv-ndot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.kmv-nitem .kmv-nm{font-size:12.5px;color:var(--km-fg-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmv-nitem.sel .kmv-nm{color:var(--km-fg);font-weight:600}
.kmv-nitem .kmv-ny{font-size:10.5px;color:var(--km-muted-2);font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---------- 画布 ---------- */
.kmv-canvas{flex:1;position:relative;min-width:0;min-height:0;background:var(--km-panel);overflow:hidden}
/* 直系子代选择器：只命中 .kmv-svg，避免污染画布内浮窗/图例/控件里的图标 svg（级联 footgun） */
.kmv-canvas > .kmv-svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:radial-gradient(circle at 1px 1px,var(--km-grid) 1px,transparent 0) 0 0/26px 26px}
.kmv-canvas > .kmv-svg:active{cursor:grabbing}
.kmv-canvas.view-timeline > .kmv-svg{background:var(--km-panel)}
.kmv-canvas.view-tl-mobile > .kmv-svg{display:none}
.kmv-canvas.view-tl-mobile .kmv-legend-stack{display:none}
.kmv-canvas.view-tl-mobile .kmv-tlmobile{display:block}
.kmv-svg .kmv-node{cursor:pointer}
.kmv-svg .kmv-node .kmv-fill{transition:opacity .15s}
.kmv-svg .kmv-node.sel .kmv-fill{stroke:var(--km-accent);stroke-width:3.5;filter:drop-shadow(0 0 4px var(--km-accent))}
.kmv-svg .kmv-node.sel text.nlabel{fill:var(--km-accent);font-weight:700}
.kmv-svg .kmv-node.sel text.year{fill:var(--km-accent)}
.kmv-svg .kmv-node text.nlabel{font-size:11.5px;fill:var(--km-fg-2);pointer-events:none;font-weight:550;text-anchor:middle}
.kmv-svg .kmv-node text.year{font-size:10px;fill:var(--km-muted-2);font-family:var(--mono);font-weight:400;text-anchor:middle}
.kmv-svg .kmv-node .status-dot{stroke:var(--km-panel);stroke-width:1.5}
.kmv-svg .kmv-link{fill:none;transition:opacity .15s,stroke-opacity .15s}
.kmv-dim{opacity:.10!important}
.kmv-svg .kmv-link.kmv-dim{opacity:.05!important}
.kmv-svg .tl-axis text{fill:var(--km-muted);font-size:11px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kmv-svg .tl-axis line{stroke:var(--km-grid-strong);stroke-width:1}
.kmv-svg .tl-goallabel{fill:var(--km-muted);font-size:11px;font-family:var(--mono)}

.kmv-tip{position:absolute;pointer-events:none;z-index:20;background:var(--km-panel);border:1px solid var(--km-border);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--km-fg);box-shadow:var(--km-shadow);max-width:260px;opacity:0;transition:opacity .12s}
.kmv-tip.on{opacity:1}
.kmv-tip b{font-weight:650}
.kmv-toast{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--km-panel);border:1px solid var(--km-border);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--km-fg);box-shadow:var(--km-shadow);opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:80vw;text-align:center}
.kmv-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 图例（可折叠 · 关系 + 更多[证据/成熟度] + 标签筛选） ---------- */
/* 左下栈：标签面板（上）+ 图例（下），各自可独立折叠 */
.kmv-legend-stack{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:8px;max-width:min(248px,calc(100vw - 28px));max-height:calc(100% - 28px)}
.kmv-tags-panel{background:var(--km-panel);border:1px solid var(--km-border);border-radius:12px;box-shadow:var(--km-shadow);overflow:hidden}
.kmv-tags-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;cursor:pointer;user-select:none}
.kmv-tags-head:hover{background:var(--km-panel-2)}
.kmv-tags-title{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--km-muted);font-weight:600}
.kmv-tags-toggle{background:none;border:none;cursor:pointer;color:var(--km-muted);padding:0;display:grid;place-items:center;border-radius:4px}
.kmv-tags-toggle:hover{color:var(--km-fg)}
.kmv-tags-toggle svg{width:14px;height:14px;display:block;transition:transform .18s}
.kmv-tags-panel.collapsed .kmv-tags-toggle svg{transform:rotate(-90deg)}
.kmv-tags-panel.collapsed .kmv-tags-body{display:none}
.kmv-tags-body{padding:4px 11px 12px;display:flex;flex-wrap:wrap;gap:7px;max-height:190px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.kmv-legend{background:var(--km-panel);border:1px solid var(--km-border);border-radius:12px;padding:11px 13px;box-shadow:var(--km-shadow);font-size:11.5px}
.kmv-leg-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kmv-leg-head .kmv-leg-title{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--km-muted);font-weight:600}
.kmv-leg-toggle{background:none;border:none;cursor:pointer;color:var(--km-muted);padding:2px;display:grid;place-items:center;border-radius:4px}
.kmv-leg-toggle:hover{color:var(--km-fg)}
.kmv-leg-toggle svg{width:14px;height:14px;display:block;transition:transform .18s}
.kmv-legend.collapsed .kmv-leg-toggle svg{transform:rotate(-90deg)}
.kmv-legend.collapsed .kmv-leg-body{display:none}
.kmv-legend.collapsed{padding:9px 13px}
.kmv-leg-body .kmv-lsec{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--km-muted);font-weight:600;margin:9px 0 5px}
.kmv-leg-body .kmv-lsec:first-child{margin-top:0}
.kmv-leg-body .kmv-lrow{display:flex;align-items:center;gap:8px;padding:3px 4px}
.kmv-leg-body .kmv-lsw{width:26px;flex:0 0 auto;height:0;border-top-width:2.5px;border-top-style:solid}
.kmv-leg-body .kmv-lsw.dot{border-top-style:dotted}
.kmv-leg-body .kmv-lsw.dash{border-top-style:dashed}
.kmv-leg-body .kmv-lname{color:var(--km-fg-2);flex:1}
.kmv-leg-body .kmv-lname .en{color:var(--km-muted-2);font-family:var(--mono);font-size:10px}
.kmv-leg-body .kmv-ltag{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:6px;cursor:pointer}
.kmv-leg-body .kmv-ltag:hover{background:var(--km-panel-2)}
.kmv-leg-body .kmv-ltag.muted{opacity:.35}
.kmv-leg-body .kmv-ltag i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.kmv-leg-body .kmv-lmore-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:4px 5px;border-radius:6px;cursor:pointer}
.kmv-leg-body .kmv-lmore-head:hover{background:var(--km-panel-2)}
.kmv-leg-body .kmv-lmore-head span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--km-muted);font-weight:600}
.kmv-leg-body .kmv-lmore-toggle{width:12px;height:12px;display:block;transition:transform .18s}
.kmv-leg-body .kmv-lmore{display:none;margin-top:2px}
.kmv-legend.more-open .kmv-lmore{display:block}
.kmv-legend.more-open .kmv-lmore-toggle{transform:rotate(180deg)}

/* ---------- 手机时间线：纵向滚动卡片（窄屏专用） ---------- */
.kmv-tlmobile{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px max(26px,env(safe-area-inset-bottom));display:none;z-index:1}
.kmv-tlm-yr{margin-bottom:10px}
.kmv-tlm-yhead{position:sticky;top:0;z-index:2;background:var(--km-panel);font-family:var(--mono);font-size:13px;font-weight:700;color:var(--km-accent);padding:9px 2px 7px;letter-spacing:.02em}
.kmv-tlm-yhead::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--km-accent);margin-right:9px;vertical-align:1px}
.kmv-tlm-node{display:flex;align-items:center;gap:12px;padding:12px;margin:0 0 8px 16px;background:var(--km-panel);border:1px solid var(--km-border);border-left:3px solid var(--c,#cbcbcb);border-radius:12px;cursor:pointer;transition:opacity .15s,transform .12s;touch-action:manipulation}
.kmv-tlm-node:active{transform:scale(.99)}
.kmv-tlm-node.kmv-dim{opacity:.28}
.kmv-tlm-node.sel{border-color:var(--km-accent);background:var(--km-accent-soft)}
.kmv-tlm-dot{width:11px;height:11px;border-radius:50%;background:var(--c,#cbcbcb);flex:0 0 auto}
.kmv-tlm-info{flex:1;min-width:0}
.kmv-tlm-title{font-size:14px;font-weight:600;color:var(--km-fg);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kmv-tlm-meta{font-size:11.5px;color:var(--km-muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.kmv-tlm-status{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:650;flex:0 0 auto;white-space:nowrap}

/* ---------- 节点详情：可拖拽浮动窗口（默认居中） ---------- */
.kmv-detail{position:absolute;z-index:60;width:min(540px,92%);max-height:84%;display:flex;flex-direction:column;background:var(--km-panel);border:1px solid var(--km-border);border-radius:12px;box-shadow:var(--km-shadow-lg);overflow:hidden;animation:kmvPop .18s cubic-bezier(.2,.8,.2,1)}
.kmv-detail.dragging{animation:none}
.kmv-detail[hidden]{display:none}
@keyframes kmvPop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.kmv-dbar{display:flex;align-items:center;gap:9px;padding:10px 10px 10px 13px;border-bottom:1px solid var(--km-border-soft);cursor:grab;user-select:none;background:var(--km-panel-2)}
.kmv-dbar:active{cursor:grabbing}
.kmv-grip{color:var(--km-muted-2);flex:0 0 auto;opacity:.6;display:grid;place-items:center}
.kmv-grip svg{width:13px;height:13px;display:block}
.kmv-dbar .kmv-dtitle{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.3;margin:0;color:var(--km-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmv-mini{flex:0 0 auto;border:1px solid var(--km-border);background:var(--km-panel);color:var(--km-fg-2);border-radius:8px;height:26px;padding:0 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:border-color .15s,color .15s;cursor:pointer}
.kmv-mini:hover{border-color:var(--km-accent);color:var(--km-accent)}
.kmv-mini.icon{width:26px;padding:0;justify-content:center}
.kmv-mini svg{width:12px;height:12px;display:block}
.kmv-dbar .tchev{transition:transform .18s}
.kmv-detail.tags-collapsed .tchev{transform:rotate(180deg)}
.kmv-dclose{flex:0 0 auto;border:1px solid var(--km-border);background:var(--km-panel);color:var(--km-fg-2);width:26px;height:26px;display:grid;place-items:center;border-radius:8px;cursor:pointer}
.kmv-dclose:hover{color:var(--km-fg);border-color:var(--km-fg)}
.kmv-dclose svg{width:12px;height:12px}
.kmv-dtags{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 0}
.kmv-tag-summary{display:none;align-items:center;gap:6px;padding:10px 14px 0;font-size:11.5px;color:var(--km-muted)}
.kmv-tag-summary b{color:var(--km-fg-2);font-weight:600}
.kmv-detail.tags-collapsed .kmv-dtags{display:none}
.kmv-detail.tags-collapsed .kmv-tag-summary{display:flex}
.kmv-chip{font-size:10.5px;padding:2px 8px;border-radius:9999px;font-weight:600;background:color-mix(in oklch,var(--c,var(--accent2)) 14%,transparent);color:var(--km-fg);border:1px solid var(--km-border);display:inline-flex;align-items:center;gap:5px}
.kmv-chip i{width:7px;height:7px;border-radius:50%}
.kmv-dmeta{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px 0;font-size:11.5px;color:var(--km-muted)}
.kmv-dmeta .m{display:inline-flex;align-items:center;gap:5px}
.kmv-dmeta .sdot{width:8px;height:8px;border-radius:50%}
.kmv-dmeta b{color:var(--km-fg-2);font-weight:600}
.kmv-dbody-wrap{padding:11px 0 0;overflow:auto;flex:1;min-height:80px}
.kmv-dbody{padding:0 14px 11px;font-size:13px;color:var(--km-fg-2);line-height:1.65}
.kmv-dbody .md:empty{display:none}
.kmv-dbody .md p{margin:8px 0}
.kmv-dbody .md :first-child{margin-top:0}
.kmv-dbody .md strong{color:var(--km-fg);font-weight:650}
.kmv-dbody .md ul,.kmv-dbody .md ol{margin:8px 0;padding-left:20px}
.kmv-dbody .md li{margin:3px 0}
.kmv-dbody .md code{font-family:var(--mono);font-size:12px;background:var(--km-panel-2);padding:1px 5px;border-radius:4px}
.kmv-drels{margin:0 14px 14px;border-top:1px dashed var(--km-border);padding-top:11px}
.kmv-drels .kmv-dh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--km-muted);margin-bottom:8px;font-weight:600}
.kmv-drel{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;flex-wrap:wrap}
.kmv-drel .kmv-arrow{color:var(--km-muted-2);font-family:var(--mono)}
.kmv-drel .kmv-rtype{font-size:10px;padding:1px 7px;border-radius:5px;font-weight:650;white-space:nowrap}
.kmv-drel .kmv-rtype .en{font-family:var(--mono);font-size:9.5px}
.kmv-drel .kmv-evi{font-size:9.5px;padding:1px 6px;border-radius:9999px;font-weight:600;border:1px solid var(--km-border);color:var(--km-muted);white-space:nowrap}
.kmv-drel .kmv-evi.r3{background:var(--km-fg);color:var(--km-panel);border-color:var(--km-fg)}
.kmv-drel .kmv-evi.r2{color:var(--km-fg-2);border-color:var(--km-fg-2)}
.kmv-drel .kmv-tgt{color:var(--km-accent);cursor:pointer;font-weight:550}
.kmv-drel .kmv-tgt:hover{text-decoration:underline}
.kmv-drel .kmv-desc{color:var(--km-muted);font-size:11px;line-height:1.45;margin-top:2px;width:100%}
.kmv-drel .kmv-papers{font-family:var(--mono);font-size:10.5px;color:var(--km-muted-2);margin-top:3px;width:100%}

/* ---------- 核心洞察弹层 + 标签 chip（标签 chip 现置于左下「标签」可折叠面板内） ---------- */
.kmv-insight{position:absolute;inset:0;z-index:70;display:none;background:rgba(0,0,0,.32);padding:6vh 16px;overflow:auto}
.kmv-insight.open{display:block;animation:kmvFade .18s}
@keyframes kmvFade{from{opacity:0}to{opacity:1}}
.kmv-ins-card{max-width:640px;margin:0 auto;background:var(--km-panel);border:1px solid var(--km-border);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.22);overflow:hidden}
.kmv-ins-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--km-border-soft);background:var(--km-panel-2)}
.kmv-ins-head h2{margin:0;font-size:15px;font-weight:700;flex:1;color:var(--km-fg)}
.kmv-ins-sub{font-size:11px;color:var(--km-muted);font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmv-ins-body{padding:8px 18px 18px}
.kmv-ins-block{padding:12px 0;border-bottom:1px dashed var(--km-border-soft)}
.kmv-ins-block:last-child{border-bottom:0}
.kmv-ins-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--km-accent);font-weight:650;margin-bottom:6px}
.kmv-ins-text{font-size:13.5px;color:var(--km-fg-2);line-height:1.7}
.kmv-ins-text strong{color:var(--km-fg);font-weight:650}
.kmv-ins-empty{padding:30px 0;text-align:center;color:var(--km-muted);font-size:13px}
.kmv-tag-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9999px;border:1px solid var(--km-border);background:var(--km-panel);color:var(--km-fg-2);font-size:12.5px;font-weight:550;cursor:pointer;transition:.15s}
.kmv-tag-chip:hover{border-color:var(--km-fg);color:var(--km-fg)}
.kmv-tag-chip i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.kmv-tag-chip.off{opacity:.32}
.kmv-tag-empty{color:var(--km-muted);font-size:13px;padding:24px;text-align:center;width:100%}

/* ---------- 全屏专注模式 ---------- */
.kmv-root.kmv-zen .kmv-side,.kmv-root.kmv-zen .kmv-legend-stack{display:none}
.kmv-root.kmv-zen .kmv-bar{display:none}

/* ---------- 空态 ---------- */
.kmv-empty{padding:60px 30px;text-align:center;color:var(--km-muted);font-size:13px}

/* ---------- 响应式：桌面展开 / 移动收入「更多」 ---------- */
@media (max-width:860px){
  .kmv-more{display:grid;place-items:center}
  .kmv-stats{display:none}
  .kmv-metabar{display:none}
  .kmv-title{font-size:13.5px;max-width:calc(100vw - 130px)}
  /* 移动端：压缩顶栏高度与图标尺寸，避免挤压/占位过大 */
  .kmv-bar{height:44px;padding:0 8px;gap:6px}
  .kmv-iconbtn{width:28px;height:28px;border-radius:8px}
  .kmv-iconbtn svg{width:14px;height:14px}
  .kmv-brand{left:auto;right:auto;transform:none;position:static;flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
  .kmv-title{font-size:13px;max-width:calc(100vw - 96px)}
  .kmv-bar > .kmv-iconbtn[data-act="side"]{flex:0 0 auto}
  .kmv-actions{position:absolute;top:44px;right:8px;flex-direction:column;align-items:stretch;gap:4px;background:var(--km-panel);border:1px solid var(--km-border);border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.16);display:none;z-index:30;min-width:172px}
  .kmv-actions.open{display:flex}
  .kmv-actions .kmv-btn{width:100%;justify-content:flex-start}
  .kmv-actions .kmv-seg{width:100%}
  .kmv-actions .kmv-tab{flex:1;justify-content:center}
  .kmv-side{position:absolute;left:0;top:0;bottom:0;z-index:25;width:80%;max-width:280px;box-shadow:var(--km-shadow)}
  /* 移动端侧栏最宽 280px，而通用折叠偏移只有 -264px（桌面侧栏宽度），会露出 16px
     占据左边缘并吞掉点击（"左边空出一块无法点击"）。移动端折叠时整体推出视口外，
     并禁止接收指针事件，确保左边缘完全让给画布。 */
  .kmv-root.kmv-side-collapsed .kmv-side{margin-left:calc(-100% - 24px);pointer-events:none}
}

/* ============ 翻页箭头（仅桌面+鼠标 hover） ============ */
.nav-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:4;
  width:42px;height:42px;border-radius:var(--radius-pill);
  border:1px solid var(--border);background:color-mix(in oklch,var(--bg) 72%,transparent);
  color:var(--fg);display:grid;place-items:center;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);
  backdrop-filter:blur(4px);
}
.nav-arrow svg{width:20px;height:20px}
.nav-prev{left:14px}.nav-next{right:14px}
.nav-arrow:hover{border-color:var(--fg)}
@media (hover:hover) and (pointer:fine){
  .window:hover .nav-arrow{opacity:1;pointer-events:auto}
  .window:hover .nav-arrow.disabled{opacity:.25;pointer-events:none}
}

/* ============ 底部文件坞（苹果相册式） ============ */
.dock{
  position:relative;z-index:6;flex-shrink:0;
  padding:6px max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
}
.dock-track{position:relative;display:flex;align-items:center;gap:10px;overflow-x:auto;scroll-behavior:smooth;
  padding:8px 6px;scrollbar-width:none}
.dock-track::-webkit-scrollbar{display:none}
.dock-track::before,.dock-track::after{content:"";flex:0 0 2px}
.group-card{
  display:flex;align-items:center;gap:3px;flex:0 0 auto;
  padding:5px 7px 5px 6px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  transition:border-color .2s var(--ease);
}
.group-card:hover{border-color:var(--fg)}
.group-card.has-active{border-color:var(--fg)}
.thumb{
  position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;cursor:pointer;opacity:.6;
  transition:opacity .2s var(--ease),background .2s var(--ease);
}
.thumb svg{width:19px;height:19px;color:var(--muted)}
.thumb:hover{background:color-mix(in oklch,var(--fg) 6%,transparent);opacity:.9}
.thumb.active{opacity:1;background:color-mix(in oklch,var(--fg) 14%,transparent)}
.thumb.active svg{color:var(--fg)}
.thumb.near{opacity:.85}

/* ============ 手牌展开（S3） ============ */
/* 分组视图：安卓后台式 · 一行两列缩略窗口 */
.fan{
  position:fixed;inset:0;z-index:30;background:color-mix(in oklch,var(--bg) 55%,transparent);
  backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;
}
.fan[hidden]{display:none} /* hidden 必须生效，否则 backdrop-filter 浮层常驻会把整页模糊 */
.fan-head{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;
  padding:max(14px,env(safe-area-inset-top)) 16px 8px}
.fan-head .fh-title{flex:1;font-size:14px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fan-deck{width:100%;max-width:560px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;
  padding:6px 14px max(24px,env(safe-area-inset-bottom));box-sizing:border-box}
.recent-card{
  position:relative;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;
  transition:transform .18s var(--ease),border-color .18s var(--ease);
}
.recent-card:hover{border-color:var(--fg)}
.recent-card:active{transform:scale(.97)}
.recent-card.selected{border-color:var(--fg)}
.rc-bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--border)}
.rc-bar svg{width:13px;height:13px;color:var(--muted);flex:0 0 auto}
.rc-bar .rc-name{font-size:11px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-body{height:118px;background:var(--surface);overflow:hidden;position:relative}
.rc-fill{width:100%;height:100%;display:block}
.rc-vid{width:100%;height:100%;background:linear-gradient(135deg,#181818,color-mix(in oklch,#2962ff 55%,#181818));display:grid;place-items:center}
.rc-vid svg{width:26px;height:26px;color:#ffffff;opacity:.85}
.rc-wave{width:100%;height:100%;display:flex;align-items:center;gap:2px;padding:10px}
.rc-wave span{flex:1;background:var(--accent);opacity:.5;border-radius:2px;min-width:2px}

const TYPE_ICON={markdown:I.tMd,pdf:I.tPdf,image:I.tImg,video:I.tVid,audio:I.tAud,text:I.tText,'knowledge-map':I.tMap};
const TYPE_LABEL={markdown:'文档',pdf:'PDF',image:'图像',video:'视频',audio:'音频',text:'文本','knowledge-map':'知识地图'};

/* ============ 通用文件卡：按扩展名识别格式 → SVG 画面（未知类型走兜底） ============ */
const EXT_KIND={
  archive:['zip','gz','tar','tgz','bz2','xz','rar','7z','iso','cab','lz','zst'],
  html:['html','htm','xhtml','mht'],
  code:['py','pyw','js','mjs','cjs','ts','tsx','jsx','sh','bash','zsh','fish','go','rs','java','kt','kts','c','h','cpp','hpp','cc','cxx','cs','rb','php','swift','scala','clj','cljs','ex','exs','erl','sql','r','lua','pl','pm','vue','svelte','dart','yaml','yml','toml','ini','cfg','conf','env','ps1','psm1','bat','cmd','gradle','groovy','mk','vim','hs','ml','nim','zig'],
  json:['json','jsonc','json5','geojson','topojson','ndjson'],
  css:['css','scss','sass','less','styl'],
  text:['txt','text','log','csv','tsv']
};
const KIND_LABEL={archive:'压缩包',html:'HTML',code:'代码',json:'JSON',css:'样式',text:'文本',generic:'文件'};
function detectExt(it){
  const d=(it.ext||(it.meta&&it.meta.ext)||'').toLowerCase().replace(/^\./,''); if(d)return d;
  const seg=(it.url||'').split('?')[0].split('#')[0].split('/').pop();
  const m1=/\.([a-z0-9]{1,8})$/i.exec(seg||''); if(m1)return m1[1].toLowerCase();
  const m2=/\.([a-z0-9]{1,8})$/i.exec(it.title||''); if(m2)return m2[1].toLowerCase();
  return '';
}
function fileKind(it){
  const ext=detectExt(it);
  for(const k in EXT_KIND)if(EXT_KIND[k].indexOf(ext)>=0)return {kind:k,ext:ext,label:KIND_LABEL[k]};
  return {kind:'generic',ext:ext,label:KIND_LABEL.generic};
}
function typeLabelFor(it){
  if(it.type==='text'||!(it.type in TYPE_LABEL))return fileKind(it).label;
  return TYPE_LABEL[it.type];
}
function fileExtTag(k){return k.ext?('.'+k.ext.toUpperCase()):k.label}
/* 按格式的 SVG 画面（仅注册色板：代码·文本 / HTML / 压缩包 / JSON / 样式 / 未知） */
function formatArt(kind){
  const INK='#181818',ACC='#2962ff',MUT='#6d6d6d',BDR='#cbcbcb';
  const open='<svg class="file-art" viewBox="0 0 240 150" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  const bar=(x,y,w,c,o)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="6" rx="3" fill="'+c+'" stroke="none"'+(o!=null?' opacity="'+o+'"':'')+'/>';
  if(kind==='code'||kind==='text')return open

function fmtRemain(iso){const ms=new Date(iso)-Date.now();if(ms<=0)return'已过期';const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d>0?d+'天'+h+'h':h+'h'}

function mapSVG(big){ /* knowledge-map 微缩/全图 */

/* markdown 卡片正面：异步渲染真实首屏正文（标题已在卡片上方，这里只取前几段），按 url 缓存 */
const _mdCache={};
function fillMdExcerpt(card,it){
  const box=card.querySelector('[data-md]');if(!box)return;
  if(!it.url){box.innerHTML='';return}
  const done=h=>{box.innerHTML=h||''};
  if(_mdCache[it.url]!=null){done(_mdCache[it.url]);return}
  fetch(it.url).then(r=>r.ok?r.text():Promise.reject()).then(md=>{
    const parse=window.marked&&(window.marked.parse||window.marked);
    const t=document.createElement('div');t.innerHTML=parse?parse(md):'';
    const ps=[...t.querySelectorAll('p')].slice(0,3);
    let out='';ps.forEach(p=>out+=`<p>${p.innerHTML}</p>`);
    _mdCache[it.url]=out;done(out);
  }).catch(()=>done(''));
}
function cardFace(it){

  }else if(t==='image'){body=`<div class="img-wrap">${it.url?`<img class="img-art" src="${it.url}" alt="${it.title}" loading="lazy" style="object-fit:cover">`:spectrumSVG()}</div>`}

  else if(t==='audio'){

    const dur=(it.meta&&it.meta.duration)||'0:00';

  else{body=fileCardHTML(it)} /* text / file / 未知类型 → 通用格式卡（SVG 按扩展名，未知走兜底） */
  return body;
}

function showCard(i,dir,animate=true){
  const es=document.getElementById('empty-state');if(es)es.hidden=items.length>0;
  if(!items.length)return;
  i=(i+items.length)%items.length; // 安全；但不循环语义在边界已由调用方 clamp
  current=i;
  const it=items[i];
  const card=buildCard(it);
  card.classList.add('active');
  if(animate){
    card.classList.add(dir>0?'enter-next':'enter-prev');
    el.stack.appendChild(card);
    requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('enter-next','enter-prev')));
    const old=el.stack.querySelector('.card:not(.enter-next):not(.enter-prev)');
    // 旧的离开
    Array.from(el.stack.querySelectorAll('.card')).forEach(o=>{if(o!==card){o.classList.remove('active');o.classList.add(dir>0?'leave-next':'leave-prev');setTimeout(()=>o.remove(),460)}});
    sweep();
  }else{
    el.stack.appendChild(card);
    Array.from(el.stack.querySelectorAll('.card')).forEach(o=>{if(o!==card)o.remove()});
  }
  updateDock();updateArrows();savePos();
}

function buildDock(){
  el.dock.innerHTML='';

  items.forEach((it,i)=>{const g=it.group||'';

    if(!grp){grp={g,list:[]};gmap[g]=grp;groups.push(grp);}

  });
  groups.forEach(grp=>{
    const card=document.createElement('div');
    card.className='group-card';card.dataset.group=grp.g;card.dataset.odId='group-card-'+grp.g;
    card.title='双击展开「'+grp.g+'」组（移动端在卡片上上滑）';
    const enter=()=>grp.list.length<2?jumpTo(grp.list[0].i):openFan(grp.g);
    grp.list.forEach(({it,i})=>{
      const th=document.createElement('div');
      th.className='thumb';th.dataset.i=i;th.dataset.odId='thumb-'+it.id;
      th.innerHTML=(TYPE_ICON[it.type]||I.tText);
      th.addEventListener('click',e=>{e.stopPropagation();jumpTo(i)});
      card.appendChild(th);
    });
    card.addEventListener('dblclick',enter); // 桌面：双击进入
    let tsx=0,tsy=0;
    card.addEventListener('touchstart',e=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY},{passive:true}); // 移动端：上滑进入
    card.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dy=tsy-t.clientY,dx=Math.abs(tsx-t.clientX);if(dy>30&&dy>dx*1.5)enter()});
    el.dock.appendChild(card);
  });
}

function renderFanSelect(){

function toggleSelect(i,forceOn){if(forceOn)fanSelect.add(i);else if(fanSelect.has(i))fanSelect.delete(i);else fanSelect.add(i);renderFanSelect()}
function selectRange(anchor,i){
  const idx=items.map((it,k)=>({it,k})).filter(x=>x.it.group===fanGroup).map(x=>x.k);
  const a=idx.indexOf(anchor),b=idx.indexOf(i);if(a<0||b<0)return;
  const lo=Math.min(a,b),hi=Math.max(a,b);for(let k=lo;k<=hi;k++)fanSelect.add(idx[k]);renderFanSelect();

function selectAllFan(){items.forEach((it,k)=>{if(it.group===fanGroup)fanSelect.add(k)});renderFanSelect()}
function onFanCardClick(e,i){
  if(fanClickGuard)return;
  if(fanMode){toggleSelect(i);lastFan=i;return}
  if(e.metaKey||e.ctrlKey){toggleSelect(i);lastFan=i;return}
  if(e.shiftKey&&lastFan!=null){selectRange(lastFan,i);return}
  closeFan();setTimeout(()=>jumpTo(i),120);
}
function miniPreview(it){
  const t=it.type;
  if(t==='image')return it.url?`<img class="rc-fill" src="${it.url}" alt="${it.title}" loading="lazy" style="object-fit:cover">`:spectrumSVG().replace('img-art','rc-fill');
  if(t==='knowledge-map')return mapSVG(false).replace('map-art','rc-fill');
  if(t==='video')return it.url?`<video class="rc-fill" src="${it.url}#t=0.1" preload="metadata" muted playsinline style="object-fit:cover"></video>`:'<div class="rc-vid">'+I.play+'</div>';
  if(t==='audio'){let b='';for(let i=0;i<24;i++){const h=20+Math.round(Math.abs(Math.sin(i*0.8))*70);b+='<span style="height:'+h+'%"></span>'}return '<div class="rc-wave">'+b+'</div>'}
  if(t==='pdf')return '<div class="rc-pdf"><i></i><i></i><i></i><i></i><i></i></div>';
  if(t==='text'||!(t in TYPE_LABEL))return '<div class="rc-file">'+formatArt(fileKind(it).kind)+'</div>';
  let s='<div class="rc-doc"><span class="h"></span>';
  for(let i=0;i<5;i++)s+='<span style="width:'+[80,95,70,90,60][i]+'%"></span>';
  return s+'</div>';
}

function openPreview(i){
  const it=items[i];if(!it||it.type==='audio')return;
  el.previewTitle.textContent=it.title;
  el.previewBody.className='preview-body';
  el.previewBody.innerHTML='';
  el.preview.classList.add('open');
  if(it.type==='markdown')return loadMarkdown(it);
  if(it.type==='pdf')return loadPdf(it);
  if(it.type==='image')return loadImage(it);
  if(it.type==='knowledge-map')return loadMap(it);
  if(it.type==='video')return loadVideo(it);
  return loadText(it); /* text / file / 未知类型 → 通用预览（压缩包/未知提示下载；代码·文本取源码；其余兜底画面） */
}

function pvLoading(msg){el.previewBody.innerHTML='<div class="pv-loading"><span class="spin"></span><span>'+msg+'</span></div>'}
function pvFrame(html){el.previewBody.innerHTML=html}
function loadMarkdown(it){
  pvLoading('文档加载中…');
  const parse=window.marked&&(window.marked.parse||window.marked);
  if(!parse||!it.url)return pvFrame(mdFallbackHTML());
  fetch(it.url).then(r=>r.ok?r.text():Promise.reject()).then(md=>{
    const w=document.createElement('div');w.className='pv-doc';w.innerHTML=parse(md);
    w.querySelectorAll('table').forEach(t=>{const d=document.createElement('div');d.className='md-table-scroll';t.parentNode.insertBefore(d,t);d.appendChild(t);});
    el.previewBody.innerHTML='';el.previewBody.appendChild(w);
    if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([w]);
  }).catch(()=>pvFrame(mdFallbackHTML()));
}
function loadPdf(it){
  pvLoading('PDF 加载中…');
  el.previewBody.innerHTML='';
  const scroll=document.createElement('div');scroll.className='pv-pdf-scroll';
  const tg=document.createElement('div');tg.className='pv-pdf-stack';
  scroll.appendChild(tg);el.previewBody.appendChild(scroll);
  const ctl=document.createElement('div');ctl.className='pv-zoom-ctl';
  const mk=(ic,lb)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',lb);b.innerHTML=ic;return b};
  const bIn=mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>','放大');
  const bOut=mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>','缩小');
  const bFit=mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6M15 21h6v-6"/></svg>','复位');
  const pct=document.createElement('div');pct.className='pv-zoom-pct';pct.textContent='100%';
  ctl.appendChild(bIn);ctl.appendChild(pct);ctl.appendChild(bOut);ctl.appendChild(bFit);el.previewBody.appendChild(ctl);
  if(location.protocol==='file:'){tg.innerHTML=pdfMsgHTML(it,'本地 file:// 无法读取 PDF（浏览器跨域限制）');return}
  if(!window.pdfjsLib){tg.innerHTML=pdfMsgHTML(it,'PDF 组件未加载');return}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  const dpr=window.devicePixelRatio||1;
  let pdfDoc=null,zoom=1,rendering=false,pending=null;
  const fail=e=>{tg.innerHTML=pdfMsgHTML(it,'PDF 渲染失败：'+((e&&e.message)||e))};
  async function render(){
    if(!pdfDoc)return;
    if(rendering){pending=zoom;return}
    rendering=true;
    const W=Math.min(820,Math.round(scroll.clientWidth*0.94))*zoom;
    tg.innerHTML='';
    try{for(let n=1;n<=pdfDoc.numPages;n++){
      const page=await pdfDoc.getPage(n);
      const base=page.getViewport({scale:1});
      const vp=page.getViewport({scale:W/base.width});
      const cv=document.createElement('canvas');cv.className='pv-pdf-cv';
      cv.width=Math.round(vp.width*dpr);cv.height=Math.round(vp.height*dpr);
      cv.style.width=Math.round(vp.width)+'px';cv.style.height=Math.round(vp.height)+'px';
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
      tg.appendChild(cv);
    }}catch(e){fail(e)}
    pct.textContent=Math.round(zoom*100)+'%';rendering=false;
    if(pending!==null){const z=pending;pending=null;zoom=z;render()}
  }
  bIn.addEventListener('click',()=>{zoom=Math.min(4,zoom+0.25);render()});
  bOut.addEventListener('click',()=>{zoom=Math.max(1,zoom-0.25);render()});
  bFit.addEventListener('click',()=>{zoom=1;render()});
  if(!it.url){tg.innerHTML=pdfMsgHTML(it,'PDF 源不可用');return}
  tg.innerHTML='<div class="pv-loading"><span class="spin"></span><span>PDF 加载中…</span></div>';
  fetch(it.url).then(r=>r.ok?r.arrayBuffer():Promise.reject(new Error('HTTP '+r.status)))
    .then(buf=>window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise)
    .then(d=>{pdfDoc=d;render()}).catch(fail);
}
function pdfMsgHTML(it,msg){return '<div class="pv-fallback-note">'+msg+'，可下载或在标签页打开</div><a class="pv-openlink" href="'+it.url+'" target="_blank" rel="noopener">在新标签页打开</a>'}
function loadImage(it){
  el.previewBody.innerHTML='';
  const stage=document.createElement('div');stage.className='pv-zoom-stage';
  const tg=document.createElement('div');tg.className='pv-zoom-target';
  const img=document.createElement('img');img.alt=it.title;img.draggable=false;
  img.addEventListener('error',()=>{tg.innerHTML='<div class="pv-empty">图像暂不可用</div>'});
  img.src=it.url;tg.appendChild(img);stage.appendChild(tg);el.previewBody.appendChild(stage);addZoomControls(stage,tg);
}

const KM_DEMO_DATA = {"meta": {"title": "空间尺度理解与度量推理 — 技术路线知识地图", "version": "v1.2", "created": "2026-07-25", "updated": "2026-07-28", "domain": "AI × Spatial Intelligence × Interior Design", "tags_schema": ["感知基础", "模型层", "应用层", "基础模型", "评测基准", "自监督预训练", "深度补全", "具身智能", "世界模型", "自动驾驶"], "description": "基于四方向论文调研（S2+arXiv, 79→36篇精选）→ 2026-07-28 新增LingBot-Vision/HiSpatial/MoGe/SD-VLM → 同日v1.2新增自动驾驶单目3D检测+世界模型空间推理路径。覆盖尺寸推理的三条根本路径：几何显式管线 / 统计先验VLM / 潜空间世界模型。目标：回答「室内设计精确尺寸推理的AI技术路线」。"}, "nodes": [{"node_id": "sec_d2_metric_depth", "title": "单目度量深度估计", "tags": ["感知基础", "基础模型"], "maturity": "成熟未闭合", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2024, "body": "核心能力：从单张RGB图像输出per-pixel度量深度（米级）。\n\n技术演进四阶段：\n1. 相对深度时代 (2020-22)：MiDaS/DPT\n2. 度量突破 (2023)：ZoeDepth双分支、Metric3D规范相机空间\n3. 基础模型爆发 (2024)：DA V2(1950引)、Depth Pro(零样本)、Metric3D v2、Prompt DA\n4. 轻量化交互 (2025-)：IMU替代LiDAR、传感器融合\n\n精度边界（2026-07-28经验证）:\n- NYUv2 (室内) SOTA RMSE ~0.29-0.33m（Metric3D v2: 0.29, LingBot linear probe: 0.296, DA V2 indoor: ~0.33）\n- KITTI (室外) SOTA RMSE ~2.3-2.5m\n- 1.8m沙发测距误差约±11-27cm（根据0.30m RMSE + 距离缩放推算）\n\n2026新: UniDepthV2 (TPAMI), InfiniDepth (arXiv), Depth Anything with Any Prior (arXiv)"}, {"node_id": "sec_d3_abstract_3d", "title": "抽象3D表征与世界模型", "tags": ["感知基础", "模型层"], "maturity": "有论文支撑", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2025, "body": "核心能力：从图像流持续构建3D空间表征，输出度量尺度的点云/包围框。\n\n技术演进：\n1. 持续3D感知 (2025 Early)：C3D Percep (CVPR, 517引)\n2. VLM-3D融合 (2025 Mid)：VLM-3R(CVPR 2026)、G2VLM(CVPR 2026)\n3. 世界模型+反思 (2025-26)：ParticleFormer、ReVSI\n\n2026关键新工作:\n- HiSpatial (CVPR 2026, 微软): 首个完整D3→D1集成管线\n- SpatialStack (CVPR 2026): 层级式几何-语言融合\n- Holi-Spatial (arXiv): 视频流→全息3D空间智能"}, {"node_id": "sec_d1_spatial_vlm", "title": "空间度量多模态大模型", "tags": ["模型层", "应用层"], "maturity": "有论文支撑", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2024, "body": "核心能力：赋予VLM物理度量感知。\n\n技术演进：\n1. 概念验证 (2024)：SpatialVLM (CVPR, 945引)\n2. 基准驱动 (2025 H1)：MM-Spatial(ICCV)、InternSpatial\n3. 深度挑战 (2025 H2)：LEGO-Puzzles、ViewSpatial-Bench\n4. 方案探索 (2025 H2-)：SD-VLM(NeurIPS 2025)、HiSpatial(CVPR 2026)\n\n精度边界（2026-07-28溯源）:\n- SD-VLM MSMU-Bench: 超越GPT-4o 26.91%和Intern-VL3-78B 25.56%\n- GPT-4o定量准确率~32%, 定性~67%（SD-VLM论文Table）\n- SpatialBench: 定量位置/尺寸最低, 计数>88%\n- 定量空间问答current SOTA仍在~30-50%, 不满足生产级"}, {"node_id": "sec_d4_floorplan", "title": "图纸矢量化与几何约束求解", "tags": ["应用层"], "maturity": "有论文支撑", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2026, "body": "从raster户型图/点云提取矢量户型图。\n\n演进：像素分析(~2018)→结构化重建(2022-24: HEAT→RoomFormer)→VLM时代(2025-26: FloorplanVLM, TLC-Plan)\n\n关键挑战：「几何幻觉」——VLM在精确空间生成上的不可靠性。"}, {"node_id": "sec_dav2", "title": "Depth Anything V2", "tags": ["基础模型", "感知基础"], "maturity": "成熟未闭合", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2024, "body": "NeurIPS 2024, 1950引。深度基础模型里程碑。\n\n精度: NYUv2 metric finetune RMSE ~0.33m, KITTI metric outdoor RMSE ~2.8m\n\n枢纽: 向后继承MiDaS/DPT/ZoeDepth, 向前开启Prompt DA和大量下游应用。"}, {"node_id": "sec_depth_pro", "title": "Depth Pro (Apple)", "tags": ["基础模型", "感知基础"], "maturity": "成熟未闭合", "status": "growing", "created": "2026-07-25", "updated": "2026-07-28", "year": 2024, "body": "ICLR 2025, 518引。零样本度量深度，<1秒推理，无需相机内参。\n\n主指标: δ1 和 平均rank (2.5, 6个dataset中最佳)\n边界精度SOTA: F1和boundary recall全面领先。"}, {"node_id": "sec_floorplanvlm", "title": "FloorplanVLM", "tags": ["应用层"], "maturity": "概念阶段", "status": "growing", "created": "2026-07-25", "updated": "2026-07-28", "year": 2026, "body": "2026年arXiv (2602.06507), 2引。基于Qwen2.5-VL-3B, 将户型图矢量化定义为序列建模任务。\n\n使用GRPO RL缓解「几何幻觉」。Floorplan-2M数据集。VLM进入矢量户型图范式转换信号。"}, {"node_id": "sec_spatialvlm", "title": "SpatialVLM", "tags": ["模型层"], "maturity": "经典闭环", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2024, "body": "CVPR 2024, 945引。奠基石。\n\n3D场景→自动生成空间QA对→SFT VLM。首次将空间推理从语义关系(left/right)推进到度量关系(X meters)。"}, {"node_id": "sec_c3d_perception", "title": "Continuous 3D Perception Model", "tags": ["感知基础", "基础模型"], "maturity": "有论文支撑", "status": "fulfilled", "created": "2026-07-25", "updated": "2026-07-28", "year": 2025, "body": "CVPR 2025, 517引。D3最高影响力。\n\n状态化循环模型——不是逐帧估计, 是在时间维度累积3D知识。输出度量尺度点云图。思想:「空间理解不是快照, 是持续构建过程」。"}, {"node_id": "sec_lingbot_vision", "title": "LingBot-Vision / LingBot-Depth 2.0 (Ark)", "tags": ["自监督预训练", "感知基础", "深度补全"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2026, "body": "2026年7月技术报告(arXiv:2607.05247), 31页。Zelin Fu, Bin Tan, Nan Xue等。\n\n核心: Masked Boundary Modeling—边界作为原生学习信号。\n1B ViT-g, 300k迭代(≈1/3 DINOv3计算量)。\n\n精度:\n- NYUv2 depth RMSE (linear probe, frozen): 0.296 ← 超越7B DINOv3 (0.309)\n- 蒸馏ViT-L 0.3B: 0.310 ≈ 7B DINOv3, 参数少23×\n- LingBot-Depth 2.0: 14个depth completion benchmark领先\n\n⚠️ 深度补全(有稀疏深度先验), 非单目深度估计。不解决单帧尺度歧义。"}, {"node_id": "sec_hispatial", "title": "HiSpatial (微软)", "tags": ["模型层"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2026, "body": "CVPR 2026 (arXiv:2603.25411), 微软亚洲研究院+清华。\n\n4级层次化3D空间理解: 几何感知→属性识别→关系推理→抽象推理\n用MoGe点云作为输入→首次完整实证D3→D1集成管线\nHiSpatial-3B在多项spatial benchmark SOTA。开源1.2M图像+空间标注训练数据。"}, {"node_id": "sec_moge", "title": "MoGe / MoGe-2 (度量几何)", "tags": ["基础模型", "感知基础"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2025, "body": "MoGe: CVPR 2025, 开源度量尺度3D点云模型。\nMoGe-2: NeurIPS 2025, 改进细节+度量尺度。\n\n关键角色: HiSpatial用MoGe作输入, 是D3→D1集成管线的感知前端。精度优于Metric3D v2 (多数据集benchmark)。"}, {"node_id": "sec_sd_vlm", "title": "SD-VLM (阿里)", "tags": ["模型层"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2025, "body": "NeurIPS 2025录用(原arXiv:2509.17664, 15引)。\n\nMSMU数据集: 700K QA pairs, 2.5M数值标注, 10K CoT样本\n深度位置编码。MSMU-Bench: 5类定量+7类定性空间问答\n\n精度: 超越GPT-4o 26.91%, 超越Intern-VL3-78B 25.56%\n定量≈50-60%, 定性≈67% ← VLM空间问答current SOTA"}, {"node_id": "sec_autonomous_3d_det", "title": "自动驾驶单目3D物体检测", "tags": ["自动驾驶", "模型层"], "maturity": "成熟未闭合", "status": "growing", "created": "2026-07-28", "year": 2024, "body": "从2D检测框+预测深度+已知焦距→3D包围框(h,w,l)。\n\n核心公式: H_3D = (Z × H_2D) / f (f已知)\n\n精度: 车辆尺寸 MAE ~0.10-0.26m (xyz位置MAE ~0.1-0.2m)\n\n⚠️ 高度结构化约束: 已知相机标定参数+平坦地面假设+受限物体类别(车/人/骑行者<10类)+窄尺寸方差(轿车±10%)+多帧时序追踪。\n\n这些条件室内设计场景一个都不满足。其准确不是推理能力的证明, 而是约束太强。\n\n综述: \"3D Object Detection from Images for Autonomous Driving\" (TPAMI 2024, 223引)\n参考数据: Blumenthal 学士论文 TUM (Mask R-CNN + 几何约束)"}, {"node_id": "sec_geometric_imagination", "title": "几何想象与潜空间空间推理 (Geometric Imagination)", "tags": ["世界模型", "模型层"], "maturity": "概念阶段", "status": "growing", "created": "2026-07-28", "year": 2025, "body": "Lian et al., Nov 2025。核心概念: VLM能否「在内部进行几何想象」—像人在脑海中旋转物体来推断形状。\n\n方法: Iterative Spatial Transformations on Internal Visual Embeddings\nBenchmark: SSI-Bench (Yang et al., Feb 2026)\n  - 人类约束一致性3D推理: 91.6%\n  - 当前最佳VLM: 33.6%\n  - 差距超过2倍, 表明潜空间推理route系统性失败\n\n思想: 路径3（世界模型）是理论上的完美载体——潜空间内推理、不依赖显式几何管线。但离实用差一个数量级。\n\n关联: 马毅「空间智能」概念—缺乏具身经验=内在物理模型缺失"}, {"node_id": "sec_robo_brain_25", "title": "RoboBrain 2.5 (具身基础模型)", "tags": ["具身智能", "模型层"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2026, "body": "arXiv 2601.14352 (2026)。Qwen3-VL backbone。\n\n核心: 从2D像素级grounding→depth-aware coordinate prediction + absolute metric constraint comprehension\n\n关键术语: metric blindness (现有多模态认知模型普遍缺乏度量感知)\n双路径: 精确3D空间推理 + 稠密时序值估计\n输出: 完整3D操作轨迹(有序关键点序列)。用于机器人操作。"}, {"node_id": "sec_world_model_platform", "title": "世界模型平台 (Genie 3 / Cosmos 3 / Marble)", "tags": ["世界模型", "基础模型"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2026, "body": "2025-2026年世界模型爆发:\n\n- Genie 3 (Google DeepMind, Aug 2025): 首个实时交互通用世界模型, 24fps生成可导航3D世界\n- Cosmos 3 (NVIDIA, 2026): Omnimodal World Model—Reasoner理解 + Generator合成。Predict/Transfer/Reason三层\n- Marble (World Labs, Fei-Fei Li, Nov 2025): 商业级3D环境生成+导航\n- AMI Labs (Yann LeCun, 2026): 独立后€500M融资, 构建理解物理而非预测文本的AI\n\n对尺寸推理的意义: 隐式世界知识—如果模型能预测「从另一个角度看这个房间什么样」, 它就隐含理解3D空间布局。但从未被用于精确尺寸推理。生成质量低, 目标是机器人训练数据生成。"}, {"node_id": "sec_paiworld", "title": "PAIWorld (3D一致性世界模型)", "tags": ["世界模型", "模型层"], "maturity": "有论文支撑", "status": "growing", "created": "2026-07-28", "year": 2026, "body": "arXiv 2606.18375 (2026)。\n\n核心: 显式跨视角几何一致性—不是flat concatenation(所有view连接起来), 而是显式cross-view geometric reasoning。\n\n超越Cosmos-Predict2和Wan2.1的3D一致性。\nScene Consistency Score: 0.9041 (AgiBot Challenge最高)\n⚠️ 注意: Scene Consistency ≠ Metric Accuracy。世界模型内的3D一致性不保证输出精确尺寸。"}, {"node_id": "sec_interior_design_goal", "title": "室内设计精确尺寸推理（目标应用）", "tags": ["应用层"], "maturity": "概念阶段", "status": "growing", "created": "2026-07-25", "updated": "2026-07-28", "year": 2026, "body": "目标: 从室内照片/视频推理精确物理尺寸(房间长宽高、家具尺寸、间距)。\n\n三路径对比 (2026-07-28):\n\n路径1-几何显式管线 (RGB→深度→3D→测量):\n  自动驾驶场景MAE ~0.10-0.26m (已知相机+平坦地面+严格类别先验+时序追踪)\n  室内场景单帧~±11-27cm (0.30m RMSE / 2-5m距离)\n  最优: 多帧融合+LingBot边界跟踪有望±3-5cm, 但需已知相机参数或参照物\n\n路径2-统计先验VLM (SD-VLM/HiSpatial):\n  定量问答~30-50%, 不够生产级\n\n路径3-潜空间世界模型:\n  人类SSI-Bench: 91.6%\n  最佳VLM: 33.6%\n  系统性失败, 根本原因在缺乏具身经验\n\n(2026-07-28) 两轮调研核心结论:\n  瓶颈不是模型选型或路径优劣, 而是信息论硬约束—单帧2D投影丢失深度维度, 损失信息不能通过NN凭空创造。\n  路径1(几何管线)在已知相机和参照物下做到±10cm级别, 已是最佳实用方案。"}], "relations": [{"from": "sec_d2_metric_depth", "to": "sec_d1_spatial_vlm", "type": "depends_on", "evidence": "#原文引用", "description": "D1度量空间推理要求度量深度信息。SD-VLM深度编码直接注入VLM。", "papers": ["SD-VLM (2025)", "SpatialVLM (2024)"]}, {"from": "sec_d2_metric_depth", "to": "sec_d3_abstract_3d", "type": "depends_on", "evidence": "#结构推导", "description": "D3依赖度量深度作前端输入。HiSpatial+MoGe是D2→D3→D1完整实证。", "papers": ["HiSpatial (2026)", "MoGe (2025)", "C3D Percep (2025)"]}, {"from": "sec_d3_abstract_3d", "to": "sec_d1_spatial_vlm", "type": "depends_on", "evidence": "#原文引用", "description": "VLM-3R/G2VLM在交叉点。HiSpatial(2026)首次完整D3→D1集成。", "papers": ["HiSpatial (2026)", "G2VLM (2025)", "VLM-3R (2025)"]}, {"from": "sec_dav2", "to": "sec_d2_metric_depth", "type": "supports", "evidence": "#原文引用", "description": "DA V2是D2最主要的基础模型(1950引), 提供度量深度微调方案。", "pa ers": ["Geometric Imagination (2025)", "SSI-Bench (2026)"]}, {"from": "sec_world_model_platform", "to": "sec_interior_design_goal", "type": "supports", "evidence": "#领域推断", "description": "⚠️ 潜在可能。隐式世界知识—模型能预测跨视角场景即隐含3D空间理解。但从未用于精确尺寸推理。Genie3/Cosmos3/Marble目标在robotics training data生成, 非尺寸测量。", "papers": ["Cosmos 3 (2026)", "Genie 3 (2025)"]}, {"from": "sec_paiworld", "to": "sec_world_model_platform", "type": "supports", "evidence": "#原文引用", "description": "显式cross-view geometric reasoning→3D一致性超越Cosmos-Predict2和Wan2.1。但Scene Consistency ≠ Metric Accuracy。", "papers": ["PAIWorld (2026)"]}, {"from": "sec_robo_brain_25", "to": "sec_geometric_imagination", "type": "depends_on", "evidence": "#结构推导", "description": "RoboBrain 2.5的metric blindness诊断与Geometric Imagination的理论一致。从depth-aware坐标预测切入同一问题。", "papers": ["RoboBrain 2.5 (2026)", "Geometric Imagination (2025)"]}], "timeline": [{"year": "2020-22", "event": "D2基础: MiDaS/DPT建立相对深度估计范式"}, {"year": "2022", "event": "D4突破: HEAT首次Transformer端到端户型图重建"}, {"year": "2023", "event": "D2度量化: ZoeDepth首次零样本度量深度"}, {"year": "2023", "event": "D4矢量化: RoomFormer/HouseDiffusion端到端矢量输出"}, {"year": "2024", "event": "D2爆发: DA V2(1950引)+Depth Pro(518引)+Metric3D v2+Prompt DA"}, {"year": "2024", "event": "D1诞生: SpatialVLM(945引)开创度量空间VQA"}, {"year": "2024", "event": "自动驾驶3D检测综述(TPAMI 2024, 223引)总结图像→3D包围框全路线"}, {"year": "2025", "event": "SD-VLM(NeurIPS): 深度编码VLM, MSMU定量空间问答benchmark"}, {"year": "2025", "event": "D3爆发: C3D Percep(517引)+VLM-3R(CVPR)+G2VLM(CVPR)+MoGe(CVPR)"}, {"year": "2025", "event": "Geometric Imagination: 潜空间空间推理概念提出, SSI-Bench公布—人类91.6% vs VLM 33.6%"}, {"year": "2025", "event": "Genie 3 (DeepMind): 首个实时交互通用世界模型"}, {"year": "2025", "event": "World Labs (Fei-Fei) Marble + NVIDIA Cosmos 平台发布"}, {"year": "2026", "event": "HiSpatial(CVPR 2026): 首次完整D3→D1集成管线实证"}, {"year": "2026", "event": "LingBot-Vision: 边界中心自监督, 1B超越7B DINOv3深度表征"}, {"year": "2026", "event": "PAIWorld: 显式跨视角几何一致性世界模型"}, {"year": "2026", "event": "RoboBrain 2.5:     if(ov>4){const h=ov/2;box._anim=inner.animate([{transform:"translateX("+h+"px)"},{transform:"translateX("+h+"px)",offset:.12},{transform:"translateX("+(-h)+"px)",offset:.88},{transform:"translateX("+(-h)+"px)",offset:1}],{duration:2400+ov*24,iterations:Infinity,easing:"ease-in-out"});}
  }
  function renderMeta(){

  // ---------- 关系图（力导向） ----------
  function buildGraph(){
    if(sim)sim.stop();
    gTL.innerHTML='';gLinks.innerHTML='';gNodes.innerHTML='';
    const W=canvas.clientWidth,H=canvas.clientHeight;
    const lk=links.map(l=>({...l,source:l.from,target:l.to}));
    sim=d3.forceSimulation(nodes)
      .force("link",d3.forceLink(lk).id(d=>d.node_id)
        .distance(d=>d.type==="subtopic_of"?70:120)
        .strength(l=>l.type==="subtopic_of"?0.9:0.45))
      .force("charge",d3.forceManyBody().strength(-460))
      .force("center",d3.forceCenter(W/2,H/2))
      .force("collide",d3.forceCollide().radius(d=>NR+14))
      .force("x",d3.forceX(W/2).strength(0.04))
      .force("y",d3.forceY(H/2).strength(0.04))
      .stop();
    for(let i=0;i<320;i++)sim.tick();

    // 关系线（同对多边错开 + 冲突对称合并）
    const drawnConflict=new Set();
    d3.select(gLinks).selectAll("path.kmv-link").data(lk.filter(l=>{
      if(l.type==="conflicts"&&l._conflictPair){const k=[l.from,l.to].sort().join("›");if(drawnConflict.has(k))return false;drawnConflict.add(k);}
      return true;
    })).enter().append("path").attr("class","kmv-link")
      .attr("stroke",d=>(KM_REL[d.type]||{color:"#999"}).color)
      .attr("stroke-width",d=>d.type==="conflicts"?2.2:1.8)
      .attr("stroke-dasharray",d=>(KM_REL[d.type]||{}).dash||null)
      .attr("stroke-opacity",.8)
      .attr("marker-end",d=>"url(#kmv-arr-"+d.type+")")
      .attr("marker-start",d=>d.type==="conflicts"?"url(#kmv-arr-"+d.type+"-rev)":null)
      .each(function(d){d._el=this;});

    // 节点
    const ns=d3.select(gNodes).selectAll("g.kmv-node").data(nodes).enter().append("g").attr("class","kmv-node")
      .attr("transform",d=>'translate('+d.x+','+d.y+')').each(function(d){d._el=this;});
    ns.append("circle").attr("class","kmv-fill").attr("r",NR)
      .attr("fill",d=>kmNodeColor(d)).attr("fill-opacity",.20)
      .attr("stroke",d=>kmNodeColor(d))
      .attr("stroke-width",d=>(KM_MATURITY[d.maturity]||{w:1.5}).w)
      .attr("stroke-dasharray",d=>(KM_MATURITY[d.maturity]||{}).dash||null)
      .attr("stroke-linecap",d=>(KM_MATURITY[d.maturity]||{}).cap||null);
    ns.append("circle").attr("class","status-dot")
      .attr("cx",NR*0.72).attr("cy",-NR*0.72).attr("r",4)
      .attr("fill",d=>KM_STATUS[d.status]||KM_STATUS.growing);
    ns.append("text").attr("class","nlabel").attr("y",NR+15).text(d=>trunc(d.title,9));
    ns.append("text").attr("class","year").attr("y",NR+28).text(d=>d.year?d.year:"");
    ns.on("mouseenter",(e,d)=>{highlight(d.node_id);showTip(e,d);}).on("mousemove",moveTip).on("mouseleave",()=>{unhighlight();hideTip();})
      .on("click",(e,d)=>{e.stopPropagation();graphSelect(d.node_id);});
    d3.selectAll("g.kmv-node").call(d3.drag()
      .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.25).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

    function applyTick(){
      lk.forEach(l=>{const s=l.source,t=l.target;if(s==null||t==null)return;
        const dx=t.x-s.x,dy=t.y-s.y,dr=Math.hypot(dx,dy)||1;
        const off=(l._idx-(l._total-1)/2)*9;const mx=(s.x+t.x)/2+(-dy/dr)*off,my=(s.y+t.y)/2+(dx/dr)*off;
        const r=NR+3,sx=s.x+(dx/dr)*r,sy=s.y+(dy/dr)*r,ex=t.x-(dx/dr)*r,ey=t.y-(dy/dr)*r;
        d3.select(l._el).attr("d",'M'+sx+','+sy+' Q'+mx+','+my+' '+ex+','+ey);});
      d3.selectAll("g.kmv-node").attr("transform",d=>'translate('+d.x+','+d.y+')');
    }
    sim.on("tick",applyTick);applyTick();
    setupZoom();applyTagFilter();
  }
  function setupZoom(){
    const root2=d3.select(gZoom);
    zoom=d3.zoom().scaleExtent([0.15,4])
      .filter(ev=>ev.type==="wheel"?true:(!ev.button&&!ev.target.closest('.kmv-node')))
      .on("zoom",e=>root2.attr("transform",e.transform));
    d3.select(svg).call(zoom).on("dblclick.zoom",null);
    setTimeout(fitGraph,60);
  }
  function fitGraph(){
    if(view!=="graph"||!zoom||!nodes.length)return;
    const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
    const pad=60,W=canvas.clientWidth,H=canvas.clientHeight;
    const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
    const k=Math.min(W/(x1-x0),H/(y1-y0),1.4);
    const tx=(W-k*(x0+x1))/2,ty=(H-k*(y0+y1))/2;
    d3.select(svg).transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));
  }
  function centerNode(n){
    if(view!=="graph"||!zoom||n.x==null)return;
    const W=canvas.clientWidth,H=canvas.clientHeight;
    d3.select(svg).transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(W/2-n.x*1.1,H/2-n.y*1.1).scale(1.1));
  }

  // ---------- 时间线（桌面 SVG） ----------
  function buildTimeline(){
    if(sim){sim.stop();sim=null;}
    gLinks.innerHTML='';gNodes.innerHTML='';gTL.innerHTML='';
    d3.select(gZoom).attr("transform",null);
    const W=canvas.clientWidth,H=canvas.clientHeight;
    const withYear=nodes.filter(n=>typeof n.year==="number");
    const noYear=nodes.filter(n=>typeof n.year!=="number");
    if(!withYear.length){d3.select(gNodes).append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","var(--km-muted)").text("无年份信息，无法绘制时间线");setupZoomTL(W,H);return;}
    const years=[...new Set(withYear.map(n=>n.year))].sort((a,b)=>a-b);
    const byYear={};withYear.forEach(n=>{(byYear[n.year]=byYear[n.year]||[]).push(n);});
    const leftPad=70,rowGap=84,cy=H/2;const pos={};
    years.forEach((y,yi)=>{const x=leftPad+yi*TL_GAP,arr=byYear[y];arr.forEach((n,i)=>{const yy=cy+(i-(arr.length-1)/2)*rowGap;pos[n.node_id]={x,y:yy};n._tl=pos[n.node_id];});});
    const goalX=leftPad+years.length*TL_GAP;
    noYear.forEach((n,i)=>{const yy=cy+(i-(noYear.length-1)/2)*rowGap;pos[n.node_id]={x:goalX,y:yy};n._tl=pos[n.node_id];});

    const ga=d3.select(gTL);
    years.forEach((y,yi)=>{const x=leftPad+yi*TL_GAP;
      ga.append("line").attr("x1",x).attr("x2",x).attr("y1",44).attr("y2",H-28).attr("stroke","var(--km-grid-strong)").attr("stroke-dasharray","3 4");
      ga.append("text").attr("class","tl-axis").attr("x",x).attr("y",28).attr("text-anchor","middle").attr("fill","var(--km-accent)").attr("font-weight",600).text(y);
    });
    if(noYear.length)ga.append("text").attr("class","tl-goallabel").attr("x",goalX).attr("y",28).attr("text-anchor","middle").text("未定年");

    const drawnConflict=new Set();
    d3.select(gLinks).selectAll("path.kmv-tlink").data(links.filter(l=>{
      if(l.type==="conflicts"&&l._conflictPair){const k=[l.from,l.to].sort().join("›");if(drawnConflict.has(k))return false;drawnConflict.add(k);}return true;
    })).enter().append("path").attr("class","kmv-link kmv-tlink").attr("fill","none")
      .attr("stroke",d=>(KM_REL[d.type]||{color:"#bbb"}).color).attr("stroke-width",d=>d.type==="conflicts"?1.6:1.3)
      .attr("stroke-dasharray",d=>(KM_REL[d.type]||{}).dash||null).attr("stroke-opacity",.16)
      .attr("marker-end",d=>"url(#kmv-arr-"+d.type+")")
      .attr("marker-start",d=>d.type==="conflicts"?"url(#kmv-arr-"+d.type+"-rev)":null)
      .attr("d",d=>{const a=pos[d.from],b=pos[d.to];if(!a||!b)return"";const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-20;return 'M'+a.x+','+a.y+' Q'+mx+','+my+' '+b.x+','+b.y;});

    const ns=d3.select(gNodes).selectAll("g.kmv-node").data([...withYear,...noYear]).enter().append("g").attr("class","kmv-node")
      .attr("transform",d=>'translate('+d._tl.x+','+d._tl.y+')').each(function(d){d._el=this;});
    ns.append("circle").attr("class","kmv-fill").attr("r",NR)
      .attr("fill",d=>kmNodeColor(d)).attr("fill-opacity",.20)
      .attr("stroke",d=>kmNodeColor(d))
      .attr("stroke-width",d=>(KM_MATURITY[d.maturity]||{w:1.5}).w)
      .attr("stroke-dasharray",d=>(KM_MATURITY[d.maturity]||{}).dash||null)
      .attr("stroke-linecap",d=>(KM_MATURITY[d.maturity]||{}).cap||null);
    ns.append("circle").attr("class","status-dot").attr("cx",NR*0.72).attr("cy",-NR*0.72).attr("r",4).attr("fill",d=>KM_STATUS[d.status]||KM_STATUS.growing);
    ns.append("text").attr("class","nlabel").attr("x",NR+8).attr("y",5).style("text-anchor","start").text(d=>trunc(d.title,14));
    ns.on("mouseenter",(e,d)=>{tlHighlight(d.node_id);showTip(e,d);}).on("mousemove",moveTip).on("mouseleave",()=>{tlUnhighlight();hideTip();})
      .on("click",(e,d)=>{e.stopPropagation();graphSelect(d.node_id);});
    setupZoomTL(goalX+TL_GAP,H);applyTagFilter();
  }
  function setupZoomTL(W,H){
    const root2=d3.select(gZoom);
    zoom=d3.zoom().scaleExtent([0.3,3])
      .filter(ev=>ev.type==="wheel"?true:(!ev.button&&!ev.target.closest('.kmv-node')))
      .on("zoom",e=>root2.attr("transform",e.transform));
    d3.select(svg).call(zoom).on("dblclick.zoom",null);
    const W0=canvas.clientWidth,k=Math.min(1,(W0-40)/W);
    d3.select(svg).call(zoom.transform,d3.zoomIdentity.translate(20,12).scale(k>0?k:1));
  }

  // ---------- 手机时间线（纵向滚动卡片） ----------
  function buildTimelineMobile(){
    const withY=nodes.filter(n=>typeof n.year==="number").sort((a,b)=>a.year-b.year);
    const noY=nodes.filter(n=>typeof n.year!=="number");
    const groups={};withY.forEach(n=>{(groups[n.year]=groups[n.year]||[]).push(n);});
    const years=Object.keys(groups).map(Number).sort((a,b)=>a-b);
    const card=n=>{const c=kmNodeColor(n);const st=KM_STATUS[n.status]||"#94a3b8";const sl=KM_STATUS_LABEL[n.status]||n.status||"—";
      return '<div class="kmv-tlm-node" data-id="'+esc(n.node_id)+'" style="--c:'+c+'"><span class="kmv-tlm-dot"></span>'
        +'<div class="kmv-tlm-info"><div class="kmv-tlm-title">'+esc(n.title)+'</div><div class="kmv-tlm-meta">'
        +(n.maturity?'<span>'+esc(n.maturity)+'</span>':'')+((n.tags||[]).slice(0,2).map(t=>'<span>'+esc(t)+'</span>').join(""))+'</div></div>'
        +'<span class="kmv-tlm-status" style="background:'+st+'1f;color:'+st+'">'+esc(sl)+'</span></div>';};

  function mobileSelect(id){
    if(selected===id){
      // 再次点击已选中的卡片 → 取消选中（不弹窗）
      selected=null;detail.hidden=true;
      treeBox.querySelectorAll('.kmv-nitem').forEach(el=>el.classList.remove('sel'));
      tlmobile.querySelectorAll('.kmv-tlm-node').forEach(el=>{el.classList.remove('sel');el.classList.remove('kmv-dim');});
      graphClearSel();

  // 力导向图 / 时间线 SVG 节点：点击 toggle 选中态
  // 1) 点击 → selectNode（弹详情 + 持久选中：节点 .sel + 相邻节点/连线高亮）
  // 2) 关闭详情（Esc/点空白）→ 保持选中，方便看相邻关系
  // 3) 再次点击同一节点 → 取消选中（清高亮、关详情，不弹窗）
  function graphSelect(id){

      tlmobile.querySelectorAll('.kmv-tlm-node').forEach(el=>{el.classList.remove('sel');el.classList.remove('kmv-dim');});

  // ---------- 高亮 ----------
  function highlight(id){const nb=neighbors(id);d3.selectAll("g.kmv-node").classed("kmv-dim",n=>!nb.has(n.node_id));d3.selectAll("path.kmv-link").classed("kmv-dim",l=>!(l.from===id||l.to===id));}
  function unhighlight(){if(selected){const nb=neighbors(selected);d3.selectAll("g.kmv-node").classed("kmv-dim",n=>!(n.node_id===selected||nb.has(n.node_id)));d3.selectAll("path.kmv-link").classed("kmv-dim",l=>!(l.from===selected||l.to===selected));return;}d3.selectAll("g.kmv-node").classed("kmv-dim",false);d3.selectAll("path.kmv-link").classed("kmv-dim",false);if(tagFilter)applyTagFilter();}

  // ---------- tooltip ----------

  function moveTip(e){const c=canvas.getBoundingClientRect();let x=e.clientX-c.left+14,y=e.clientY-c.top+14;if(x>c.width-180)x=e.clientX-c.left-170;tipEl.style.left=x+"px";tipEl.style.top=y+"px";}

  // ---------- 节点详情（可拖拽浮动窗口） ----------

      +(n.year?'<span class="m">年份 <b>'+esc(n.year)+'</b></span>':'<span class="m">年份 <b>未定</b></span>')
      +'<span class="m">ID <b style="font-family:var(--mono);font-size:11px">'+esc(n.node_id)+'</b></span>';

  function reflectSel(){treeBox.querySelectorAll('.kmv-nitem').forEach(el=>el.classList.toggle('sel',el.dataset.id===selected));tlmobile.querySelectorAll('.kmv-tlm-node').forEach(el=>el.classList.toggle('sel',el.dataset.id===selected));d3.selectAll("g.kmv-node").classed("sel",d=>d.node_id===selected);}

  // ---------- 左侧树（subtopic_of 层级 / 标签分组兜底） ----------
  function buildTree(){
    treeBox.innerHTML='';
    const sub=links.filter(l=>l.type==="subtopic_of");
    if(sub.length){
      sideHead.textContent='层级结构';
      const child={};sub.forEach(r=>{(child[r.to]=child[r.to]||[]).push(r.from);});
      const hasParent=new Set(sub.map(r=>r.from));
      const roots=nodes.filter(n=>!hasParent.has(n.node_id));
      const visit=(n,depth)=>{
        const g=document.createElement('div');g.className='kmv-grp';g.style.marginLeft=(depth*12)+"px";
        const ch=child[n.node_id]||[];
        g.innerHTML='<div class="kmv-gh"><span class="kmv-chev">'+I.chev+'</span><span class="kmv-gdot" style="background:'+kmNodeColor(n)+'"></span><span class="kmv-gname">'+esc(n.title)+'</span></div>';
        const body=document.createElement('div');body.className='kmv-gbody';body.appendChild(nodeItem(n));
        g.querySelector('.kmv-gh').onclick=()=>g.classList.toggle('closed');
        g.appendChild(body);treeBox.appendChild(g);

  (function(){

/* 自由缩放/平移：滚轮 + 拖拽 + 双指捏合 + 双击复位 + 控件按钮（图像 / PDF 共用） */
function addZoomControls(stage,tg){
  const IC={plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
    fit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v6M15 21h6v-6"/></svg>'};
  const ctl=document.createElement('div');ctl.className='pv-zoom-ctl';
  const mk=(ic,lb)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',lb);b.innerHTML=ic;return b};
  const bIn=mk(IC.plus,'放大'),bOut=mk(IC.minus,'缩小'),bFit=mk(IC.fit,'复位');
  const pct=document.createElement('div');pct.className='pv-zoom-pct';pct.textContent='100%';
  ctl.appendChild(bIn);ctl.appendChild(pct);ctl.appendChild(bOut);ctl.appendChild(bFit);el.previewBody.appendChild(ctl);
  const z=bindZoom(stage,tg,pct);
  bIn.addEventListener('click',z.in);bOut.addEventListener('click',z.out);bFit.addEventListener('click',z.reset);
}
function bindZoom(stage,tg,pct){
  const MIN=1,MAX=6;let s=1,tx=0,ty=0,sx=0,sy=0,pinch=0,drag=false;
  function apply(){tg.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';if(pct)pct.textContent=Math.round(s*100)+'%';stage.classList.toggle('zoomed',s>1)}
  function set(n){s=Math.min(MAX,Math.max(MIN,n));apply()}
  stage.addEventListener('wheel',e=>{e.preventDefault();set(s-e.deltaY*0.0015)},{passive:false});
  stage.addEventListener('dblclick',e=>{if(e.target.closest('.pv-zoom-ctl'))return;s=1;tx=0;ty=0;apply()});
  stage.addEventListener('mousedown',e=>{if(e.target.closest('.pv-zoom-ctl')||s<=1)return;drag=true;sx=e.clientX;sy=e.clientY;stage.classList.add('dragging');e.preventDefault();
    const mv=ev=>{tx+=ev.clientX-sx;ty+=ev.clientY-sy;sx=ev.clientX;sy=ev.clientY;apply()};
    const up=()=>{drag=false;stage.classList.remove('dragging');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
  stage.addEventListener('touchstart',e=>{if(e.target.closest('.pv-zoom-ctl'))return;
    if(e.touches.length===2){drag=false;pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}
    else if(e.touches.length===1&&s>1){drag=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
  stage.addEventListener('touchmove',e=>{if(e.target.closest('.pv-zoom-ctl'))return;
    if(e.touches.length===2&&pinch){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);set(s*Math.pow(d/pinch,1.5));pinch=d}
    else if(drag&&e.touches.length===1){e.preventDefault();tx+=e.touches[0].clientX-sx;ty+=e.touches[0].clientY-sy;sx=e.touches[0].clientX;sy=e.touches[0].clientY;apply()}},{passive:false});
  stage.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=0;if(e.touches.length===0)drag=false});
  return {in:()=>set(s+0.4),out:()=>set(s-0.4),reset:()=>{s=1;tx=0;ty=0;apply()}};
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hlCode(s){
  const kw=/\b(def|return|import|from|class|if|else|elif|for|while|in|is|not|and|or|lambda|with|as|None|True|False|print|range|len|sorted)\b/g;
  return s.split('\n').map(function(ln){
    if(/^\s*#/.test(ln))return '<span class="c">'+ln+'</span>';
    return ln.replace(kw,'<span class="k">$1</span>');
  }).join('\n');
